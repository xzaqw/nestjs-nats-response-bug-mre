services:
  nats:
    image: nats:2.11.8-alpine
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20

  app:
    build: .
    environment:
      NATS_URL: nats://nats:4222
    ports:
      - "3000:3000"
    depends_on:
      nats:
        condition: service_healthy
